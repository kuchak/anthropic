# === Default Fallbacks ===
default_accuracy: 0.94           # 94% avg across whitelist
accuracy_by_price_range:
  "0.90-0.93": 0.94              # Conservative estimate

# === Position Sizing ===
starting_bankroll: 10000.00
kelly_fraction: 0.207            # 20.7% avg Kelly across all tickers (will be overridden per ticker)
max_bet_pct_of_bankroll: 0.25    # Never risk more than 25% on a single bet (Kelly max)
max_total_exposure_pct: 0.70     # Never have more than 70% of bankroll in open positions
min_bet_amount: 1.00             # Kalshi minimum

# === Risk Management ===
max_daily_loss: 200.00           # Stop trading if daily losses exceed this
max_consecutive_losses: 5        # Pause and alert after N consecutive losses
max_trades_per_day: 100          # Circuit breaker (increased for more tickers)

# === Rate Limiting ===
api_requests_per_second: 2       # Stay well under Kalshi's rate limits
retry_max_attempts: 3
retry_backoff_seconds: 2
