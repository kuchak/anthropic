# === Mode ===
dry_run: true                    # true = paper trading, false = real money

# === Kalshi API ===
kalshi_api_base: "https://api.elections.kalshi.com/trade-api/v2"  # PRODUCTION API

# === Two-Tier Scanning ===
# HOT LIST: series with active markets expiring within 3 hours. Scanned every 30s.
# FULL SCAN: all series discovery. Runs every 10 min to refresh the hot list.
cycle_interval_seconds: 30              # Main loop sleep (matches hot scan interval)
hot_scan_interval_seconds: 30           # Hot series scan every 30 seconds
full_scan_interval_seconds: 600         # Full discovery every 10 minutes (600s)
max_time_to_settlement_hours: 999999    # No settlement time limit - scan ALL active markets
min_time_to_settlement_minutes: 0       # No minimum - we'll bet right up to settlement if stable
series_discovery_pages: 100             # Fetch enough pages to cover all series

# Capital velocity: shorter expiry games score higher (capital recycles faster)
# 92¢ on 30 min game scores 2.45x vs 92¢ on 3 hr game
capital_velocity_reference_hours: 3.0   # Baseline: 3-hour game = 1.0x multiplier

# === Market Filtering ===
# WHITELIST: 28 profitable tickers with 30+ markets in backtest
# Sorted by accuracy (highest first)
series_ticker_whitelist:
  # NBA (In Season) - 100%
  - KXNBAGAME              # 32 markets, 100% accuracy, 1m wait

  # NCAA Football - 96-98%
  - KXNCAAFGAME            # 51 markets, 98.0% accuracy, 3m wait
  - KXNCAAFTOTAL           # 105 markets, 96.2% accuracy, 5m wait

  # Tennis - 93-97%
  - KXATPMATCH             # 70 markets, 97.1% accuracy, 5m wait
  - KXWTAMATCH             # 88 markets, 96.6% accuracy, 3m wait
  - KXATPCHALLENGERMATCH   # 76 markets, 94.7% accuracy, 3m wait
  - KXWTACHALLENGERMATCH   # 72 markets, 93.1% accuracy, 5m wait
  - KXUNITEDCUPMATCH       # 39 markets, 92.3% accuracy, 3m wait

  # Soccer - 91-96%
  - KXSCOTTISHPREMGAME     # 52 markets, 96.2% accuracy, 3m wait
  - KXLIGUE1GAME           # 57 markets, 94.7% accuracy, 3m wait
  - KXSAUDIPLGAME          # 58 markets, 93.1% accuracy, 3m wait
  - KXUCLGAME              # 51 markets, 92.2% accuracy, 1m wait
  - KXUELGAME              # 58 markets, 91.4% accuracy, 3m wait
  - KXEPLGAME              # 46 markets, 91.3% accuracy, 1m wait
  - KXSUPERLIGGAME         # 56 markets, 91.1% accuracy, 1m wait

  # Hockey - 96%
  - KXNHLGAME              # 75 markets, 96.0% accuracy, 3m wait

  # Basketball - 95%
  - KXNBATOTAL             # 84 markets, 95.2% accuracy, 5m wait
  - KXEUROLEAGUEGAME       # 89 markets, 94.4% accuracy, 3m wait

  # Football (NFL) - 93-95%
  - KXNFLTOTAL             # 78 markets, 94.9% accuracy, 5m wait
  - KXNFLPREPACKSGP        # 32 markets, 93.8% accuracy, 3m wait
  - KXNFLSPREAD            # 46 markets, 93.5% accuracy, 3m wait

  # Baseball - 93-94%
  - KXMLBGAME              # 65 markets, 93.8% accuracy, 5m wait
  - KXMLBSPREAD            # 40 markets, 92.5% accuracy, 5m wait

  # Other Sports
  - KXFIFAGAME             # 58 markets, 94.8% accuracy, 5m wait (esports)
  - KXUFCFIGHT             # 44 markets, 93.2% accuracy, 3m wait (MMA)

  # Crypto - 92-93%
  - KXBTC15M               # 55 markets, 92.7% accuracy, 1m wait
  - KXSOL15M               # 53 markets, 92.5% accuracy, 1m wait

  # Other
  - KXINXZ                 # 46 markets, 93.5% accuracy, 5m wait (stock indices)

# === Ticker-Specific Wait Times (minutes) ===
# Bot waits this long after price first hits 90¢ before betting
series_ticker_wait_times:
  # Fast (1 minute)
  KXNBAGAME: 1
  KXBTC15M: 1
  KXSOL15M: 1
  KXUCLGAME: 1
  KXEPLGAME: 1
  KXSUPERLIGGAME: 1

